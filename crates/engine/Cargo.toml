[package]
name = "sortlens-engine"
description = "The command registry and job scheduler that everything else calls"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
sortlens-core = { workspace = true }
sortlens-meta = { workspace = true }
sortlens-catalog = { workspace = true }
sortlens-cull = { workspace = true }
sortlens-ai = { workspace = true }
sortlens-export = { workspace = true }
sortlens-similar = { workspace = true }
sortlens-insights = { workspace = true }
sortlens-memories = { workspace = true }
sortlens-hash = { workspace = true }
sortlens-thumbs = { workspace = true }
sortlens-quality = { workspace = true }
sortlens-geo = { workspace = true }
sortlens-scan = { workspace = true }
sortlens-sidecar = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }

# The model downloader (Phase 2, SL-F02): the one audited place that fetches bytes.
ureq = { workspace = true }
craft-atomic = { workspace = true }
# The update check (SL-I10). The workspace pin carries the `egui` feature for the dialog we do
# not use — the shell draws its own Settings section, the way the AI panel does — so this crate
# takes the crate with default features only, and the CLI build stays free of egui.
craft-update = { git = "https://github.com/storytold/craft-libs", rev = "23acc704933a9a5619a5cd1cddc9bb1fb5a9b2d3" }

[dev-dependencies]
sortlens-testkit = { workspace = true }
craft-jpeg = { workspace = true }
# The MBTiles discovery test builds a real archive rather than mocking one.
rusqlite = { workspace = true }

[lints]
workspace = true
