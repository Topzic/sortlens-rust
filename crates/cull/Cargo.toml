[package]
name = "sortlens-cull"
description = "The cull state machine and staged deletes"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
sortlens-core = { workspace = true }
sortlens-catalog = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The operating system's trash on the platforms the `trash` crate speaks. Android and iOS expose
# no OS trash a Rust crate can call, so on those targets the trash mode moves the file into the
# library's own `.sortlens/trash` folder instead (see `move_to_phone_trash` in `trash.rs`).
[target.'cfg(any(target_os = "windows", target_os = "macos", all(target_os = "linux", not(target_os = "android"))))'.dependencies]
trash = { workspace = true }

[lints]
workspace = true
