[package]
name = "sortlens-core"
description = "Identifiers, units, labels and errors shared by every Sortlens layer"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
# Already in the tree (through the text stack), and the only reason it is a direct dependency is that a path
# identity has to normalise Unicode: macOS writes filenames in NFD and a person types NFC, and the same folder
# must be one folder. Hand-rolling the tables is not an option and ASCII-only folding is a data-loss bug.
unicode-normalization.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
