[package]
name = "sortlens-meta"
description = "EXIF, IPTC, XMP and maker-note extraction into one metadata struct"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
sortlens-core = { workspace = true }
sortlens-geo = { workspace = true }
craft-metadata = { workspace = true }
craft-tiff = { workspace = true }
# Container-only probe (`ispe`, `irot`, `clap`) for HEIF sizes: no decode, no feature.
craft-heif = { workspace = true, features = ["decode"] }
# Container probing for video length, frame rate and codec (isobmff is on by default).
craft-media = { workspace = true, features = ["isobmff"] }
serde = { workspace = true }

[dev-dependencies]
craft-jpeg = { workspace = true }
craft-heif = { workspace = true, features = ["test-support"] }
# The MP4 writer, so a video fixture is built in the test rather than committed as a blob.
craft-media = { workspace = true, features = ["isobmff"] }

[lints]
workspace = true
