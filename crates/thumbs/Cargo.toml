[package]
name = "sortlens-thumbs"
description = "Tiered thumbnail cache and preview decoding"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
sortlens-core = { workspace = true }
sortlens-meta = { workspace = true }
craft-jpeg = { workspace = true }
craft-image-codecs = { workspace = true }
craft-raw = { workspace = true }
# HEIF/HEIC: pure Rust (heic-rs), panic-guarded, colour-matched to libheif. Enabled here rather than in the
# workspace so a crate that never decodes a photo does not pay for a decoder.
craft-heif = { workspace = true, features = ["decode"] }
# Container demuxing and H.264/HEVC decoding for video poster frames. The `frame` module's
# `VideoFrame::to_rgba8` is the colour conversion: it honours the stream's own colour tags rather
# than assuming BT.709, which is what keeps a wide-gamut phone clip from reading washed out.
craft-media = { workspace = true, features = ["isobmff"] }
craft-video = { workspace = true, features = ["h264-decode", "hevc-decode"] }
# The YUV→RGB arithmetic the poster conversion runs: matrix, range, transfer and gamut.
craft-color = { workspace = true }

[dev-dependencies]
# Synthetic HEIF files for the tests: generated by the decoder's own writer, so no binary fixture is committed.
craft-heif = { workspace = true, features = ["decode", "test-support"] }
# H.264 and HEVC encoders, so a muxed video fixture is built in the test rather than committed as a blob.
craft-video = { workspace = true, features = ["h264-decode", "hevc-decode", "h264-encode", "hevc-encode"] }

[lints]
workspace = true
