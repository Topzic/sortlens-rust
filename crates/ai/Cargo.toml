[package]
name = "sortlens-ai"
description = "Local model runtime for tagging and captioning"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
sortlens-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The inference runtime (SL-F03/F04) stays offline — the bytes come from the verified store, and
# tract runs them on the CPU.
tract-onnx = { workspace = true }
# The CLIP tokenizer's vocabulary ships gzip-compressed, exactly as upstream publishes it.
flate2 = { workspace = true }

[dev-dependencies]
# ONNX protobuf assembly for the synthetic models the tests run instead of the 166 MB pins.
prost = { workspace = true }
sortlens-testkit = { workspace = true }

[lints]
workspace = true
