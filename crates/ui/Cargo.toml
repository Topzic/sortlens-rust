[package]
name = "sortlens-ui"
description = "The egui shell: tokens, themes, panels, grid and dialogs"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
sortlens-core = { workspace = true }
sortlens-meta = { workspace = true }
sortlens-engine = { workspace = true }
sortlens-memories = { workspace = true }
sortlens-thumbs = { workspace = true }
sortlens-geo = { workspace = true }
sortlens-cull = { workspace = true }
# The app mark: the top bar paints the same generated geometry as the window icon.
sortlens-icon = { workspace = true }
egui = { workspace = true }
# The Places map: slippy-map widget, projection and tile loading.
walkers = { workspace = true }
# The opt-in online basemap (OpenFreeMap via mln-rs). It is only shown after the person accepts
# fetching map tiles; the offline map above remains the default and the fallback.
maplibre-egui = { workspace = true }
egui-wgpu = { workspace = true }
# SVG rasterisation for the monochrome icon set: `craft_ui::icons` prepares the bytes, this loads them.
egui_extras = { workspace = true }
craft-ui = { workspace = true }
# Interface strings through the suite's i18n (SL-L07): catalogues, plurals, direction.
craft-i18n = { workspace = true }
# Catalogue problems are logged, the way craft-i18n's apps log them.
log = "0.4"
# The shortcut editor (Settings → Shortcuts): rebinding, conflicts, sets, import/export.
craft-keymap = { workspace = true }
serde = { workspace = true }
# The two flag rows bind one registry command with parameters, which the keymap spells as JSON.
serde_json = { workspace = true }
# The screenshot harness renders through the same egui fork the window uses, so a baseline is the
# shell's own painting. Opt-in: it needs a GPU, which `cargo xtask ci` must not depend on.
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"], optional = true }
eframe = { workspace = true, optional = true }

[features]
# `cargo xtask screenshots`: paint the real shell at a fixed size and compare against the committed
# baselines under `crates/ui/tests/snapshots/`. Not part of `cargo xtask ci`, which must stay
# headless-only.
screenshots = ["dep:egui_kittest", "dep:eframe"]

[dev-dependencies]
sortlens-testkit = { workspace = true }
# Tests store scores directly to exercise the review; the UI itself only reads them through the engine.
sortlens-quality = { workspace = true }

[lints]
workspace = true
