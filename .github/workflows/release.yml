name: release

# Written in the block style `cargo xtask workflows` reads: block lists only (no flow lists), so the
# small YAML reader that checks this file can parse it. The `verify` job runs the same gates a pull
# request runs, and it runs beside the builds rather than in front of them: `publish` waits for it, so
# a tree that would fail the gates still never reaches a release, but the fifteen minutes it spends
# compiling no longer sit in front of a twenty-minute Windows build that was going to run anyway.
# `android` builds the phone's APK — no signing identity is
# needed, because a sideloaded APK is signed with a self-signed keystore generated for the run, named
# to `cargo apk` through `CARGO_APK_RELEASE_KEYSTORE` and its password (a release build stops before
# it signs without them) and verified with `apksigner` afterwards; and `publish` runs only on a tag,
# so a manual run leaves its artefacts as workflow artefacts and never creates a release by accident.
#
# Every `upload-artifact` step writes one glob per line: the action splits `path` on newlines, so two
# globs on one line upload nothing and still report success, which is how a run can end green with no
# artefacts at all.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: verify before building
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # The key the CI job on main already warms, so a dispatch starts from that cache instead of
          # compiling the whole graph cold behind `needs: verify`, which every other job waits on.
          key: ubuntu-latest
      - name: Linux windowing headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libvulkan-dev
      - name: ci
        run: cargo xtask ci
      - name: goldens
        run: cargo xtask snapshot

  android:
    name: the Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-apk
      - name: the SDK pieces the crate's metadata names
        run: |
          set -eu
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
      - name: cargo-apk
        run: cargo install cargo-apk --locked
      - name: the signing key this run uses
        # A sideloaded APK needs a signature, not an identity: a self-signed keystore made here, used
        # once, and never stored anywhere. `cargo apk` reads it from the two variables below and
        # refuses a release build that has neither, so it exists before the build runs.
        run: |
          set -eu
          keytool -genkeypair -keystore "$RUNNER_TEMP/sortlens.keystore" -alias sortlens \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass sortlens-key \
            -keypass sortlens-key -dname "CN=Sortlens"
      - name: build
        run: |
          set -eu
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.3.11579264"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/sortlens.keystore"
          export CARGO_APK_RELEASE_KEYSTORE_PASSWORD=sortlens-key
          cargo apk build --release -p sortlens-mobile
      - name: the signature is on the APK
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          # `cargo apk` aligns the APK and signs it, leaving the unaligned one beside it.
          apk="$(find target -name '*.apk' ! -name '*-unaligned.apk' | head -n 1)"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk"
          cp "$apk" "sortlens-${version}-android.apk"
          echo "The APK is signed with a keystore generated for this run; see docs/RELEASE.md."
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: sortlens-*-android.apk

  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: build
        run: cargo build --release -p sortlens -p sortlens-cli --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          stem="sortlens-${version}-${{ matrix.target }}"
          mkdir -p "dist/${stem}"
          suffix=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then suffix=".exe"; fi
          cp "target/${{ matrix.target }}/release/sortlens${suffix}" "dist/${stem}/"
          cp "target/${{ matrix.target }}/release/sortlens-cli${suffix}" "dist/${stem}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${stem}/"
          mkdir -p "dist/${stem}/docs"
          cp docs/BEHAVIOUR.md docs/PACKS.md docs/RELEASE.md "dist/${stem}/docs/"
          cd dist
          # Only the archive is produced here; the checksums are computed in one place, on one runner,
          # from the files that are actually uploaded. A per-runner checksum step is how a release ends
          # up with a hash of the wrong file.
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "${stem}.zip" "${stem}" >/dev/null
          else
            tar -czf "${stem}.tar.gz" "${stem}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          # One glob per line: the action splits `path` on newlines, so two globs on one line upload
          # nothing at all and still report success.
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    name: attach to the release
    needs:
      - verify
      - build
      - android
    # A manual run from `main` must not create a release: it stops here, its artefacts stay workflow
    # artefacts, and a tag run is what attaches everything to the real release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip *.apk > SHA256SUMS
          while read -r sum file; do echo "$sum  $file" > "$file.sha256"; done < SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.apk
            dist/*.sha256
            dist/SHA256SUMS
          generate_release_notes: false
          body: |
            See `docs/RELEASE.md` for what is in this build and what is deliberately absent — no bundled
            models (Settings → AI installs them by consent), the phone is the native `apps/sortlens-mobile`
            APK attached here, and the interface ships English, Arabic and Japanese. A checksum for every
            artefact is attached.
