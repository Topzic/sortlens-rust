name: CI

# Written in the block style `cargo xtask workflows` reads: flow lists (the usual `branches: [main]`)
# are refused by the small reader that checks this file, and a check that cannot read its own
# workflow is not a check.
on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Linux windowing headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libvulkan-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # The task CI runs is the task a developer runs: one definition of green.
      - name: ci
        run: cargo xtask ci

  # The phone app shares the desktop's engine and shell, so a phone target that stops compiling is a
  # regression in shared code. Ubuntu runners carry the Android NDK; macOS runners carry Xcode.
  mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
            target: aarch64-linux-android
          - os: macos-latest
            platform: ios
            target: aarch64-apple-ios
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-${{ matrix.platform }}
      - name: mobile
        run: cargo xtask mobile ${{ matrix.platform }}

  # The goldens are a claim about what the tool says. One OS, because the fixture bytes and the
  # normalised output are machine-independent, and a second machine would only add noise.
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: snapshot

      - name: snapshot
        run: cargo xtask snapshot

  # Its own job so a licence or advisory regression is named as that, not buried in a test log. Runs
  # on one OS because the check reads Cargo.lock, which is the same everywhere.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo-deny
        run: cargo install cargo-deny --locked

      - name: deny
        run: cargo xtask deny

  # A painted frame is not a value a text golden can carry, so the baselines are their own gate.
  # The runner has no GPU; Mesa's software Vulkan (lavapipe) is the adapter wgpu finds. The gate is
  # still a gate: if the baselines do not match, the job fails.
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Linux headers and software Vulkan
        # eframe compiles winit, so the same headers the ci job installs are needed to build it;
        # lavapipe is the adapter wgpu finds on a runner with no GPU.
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libvulkan-dev mesa-vulkan-drivers

      - uses: Swatinem/rust-cache@v2
        with:
          key: screenshots

      - name: screenshots
        env:
          # The committed baselines are painted by the reference rasteriser; this runner's is Mesa's
          # software Vulkan, which paints a few pixels differently. The run therefore names its own set
          # and compares that byte for byte — the same rule, against baselines from the same adapter.
          SORTLENS_SNAPSHOT_SET: lavapipe
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: cargo xtask screenshots

      # A set nobody has committed yet cannot compare, and the failure is where its frames are: they
      # are saved as .new.png beside the baselines. Uploading them on a failed run is what lets the next
      # run download this one's paint (`gh run download <id>`), commit it under the set's directory, and
      # turn the gate green. Without this step a red screenshots job has nothing to fix it with.
      - name: the frames this run painted
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-set
          path: crates/ui/tests/snapshots/**/*.new.png
          if-no-files-found: ignore
