name: Agent intake

# A stranger's report is read, never obeyed: the body is passed to the checker through the
# environment (an action interpolating it into a script line is the classic injection), and this
# job can write issue labels and nothing else. It is the enforcement half of
# docs/AUTONOMOUS_AGENT.md; the checker itself is `cargo xtask intake`, whose tests prove it bites.
on:
  issues:
    types:
      - opened
      - edited
      - labeled

permissions:
  contents: read
  issues: write

jobs:
  intake:
    # Issues only. A pull request body is not a bug report, and this job must never be reachable
    # from a branch someone else controls.
    if: ${{ github.event.issue.pull_request == null }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - uses: Swatinem/rust-cache@v2
        with:
          key: intake

      # The two labels this job swaps are created once, idempotently, so a fresh repository does not
      # fail on a missing label. `--force` updates an existing label without touching issues using it.
      - name: Ensure the labels this intake swaps exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create triaged --description "A person has read this report" --color 0e8a16 --force
          gh label create needs-info --description "The intake is waiting for a field the form requires" --color d93f0b --force

      - name: Check the report against its form
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          HAS_NEEDS_INFO: ${{ contains(github.event.issue.labels.*.name, 'needs-info') }}
          SORTLENS_ISSUE_BODY: ${{ github.event.issue.body }}
          SORTLENS_ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          if cargo xtask intake > intake.md; then
            # A complete report is triaged, and a reporter who fixed theirs is told so by the
            # label rather than by a comment nobody re-reads.
            gh issue edit "$ISSUE_NUMBER" --remove-label needs-info --add-label triaged
            exit 0
          fi
          if [ ! -s intake.md ]; then
            echo "the intake check produced no report; not touching the issue"
            exit 1
          fi
          cat intake.md
          # Adding needs-info fires this workflow again; comment only on the run that transitions
          # the issue, so a reporter gets one answer rather than one per event.
          if [ "$HAS_NEEDS_INFO" != "true" ]; then
            gh issue comment "$ISSUE_NUMBER" --body-file intake.md
          fi
          gh issue edit "$ISSUE_NUMBER" --remove-label triaged --add-label needs-info