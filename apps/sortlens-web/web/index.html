<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sortlens</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #17191c;
      color: #e8e6e3;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #sortlens-canvas { width: 100%; height: 100%; display: block; outline: none; }
    #sortlens-boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #9a9793;
      pointer-events: none;
    }
    #sortlens-boot[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="sortlens-canvas"></canvas>
  <div id="sortlens-boot">Sortlens is loading…</div>
  <script type="module">
    // The glue wasm-bindgen generated; loading the module runs the page's `start`, which
    // takes over the canvas above. The path is anchored to this page's own directory, so the
    // page works at /app and at /app/ alike — a browser must not guess the host's routes.
    const base = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
    const boot = document.getElementById('sortlens-boot');
    import(base + 'sortlens-web.js')
      .then((module) => module.default())
      .then(() => boot.remove())
      .catch((error) => {
        boot.textContent = 'Sortlens failed to load: ' + error;
        boot.style.pointerEvents = 'auto';
      });
  </script>
</body>
</html>
