[package]
name = "sortlens-web"
description = "Sortlens wasm client (SL-J02): the shell over the in-memory engine"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
sortlens-core = { workspace = true }
sortlens-engine = { workspace = true }
# The device side of the remote protocol: pairing, /api calls, the resumable upload and the
# keep-or-remove decision (SL-J05) the browser page speaks.
sortlens-remote = { workspace = true }
# What the page keeps between sessions, in browser storage.
serde_json = { workspace = true }
serde = { workspace = true }

# The page (wasm only): the suite's shell stack — theme, fonts — over an in-memory engine,
# painted by the same eframe fork the desktop window uses, through the browser's own canvas.
[target.'cfg(target_arch = "wasm32")'.dependencies]
sortlens-ui = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["glow"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
web-sys = { version = "=0.3.107", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Storage", "Location", "Headers", "Request", "RequestInit", "Response"] }
# The thumbnails arrive as PNG over the wire; the page decodes them through the same codec
# the desktop grid's decode path uses, so a browser paints what a desktop paints.
craft-image-codecs = { workspace = true }

[dev-dependencies]
sortlens-testkit = { workspace = true }

[lints]
workspace = true
